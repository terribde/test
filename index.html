<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人主页</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        max-width: 720px;
        margin: 64px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>你好，我是你的名字</h1>
      <p>
        欢迎来到我的 GitHub Pages 个人主页！我正在持续学习与分享技术内容。
      </p>
      <h2>个人简介</h2>
      <p>
        在这里你可以简单介绍自己的职业方向、技术栈、兴趣爱好，以及你正在做的项目。
      </p>
    </main>
  </body>
</html>
